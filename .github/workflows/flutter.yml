# Builds the Flutter app on every target. Linux and Windows have no local hardware on the
# maintainer's machine, so CI is where those two are actually proven.
#
# No step consumes attacker-controllable event data (issue/PR titles, branch names); the only
# interpolation is FLUTTER_VERSION, defined below.
name: flutter

on:
  push:
    branches: [master]
    paths: ['flutter_app/**', 'MolApp/Resources/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter_app/**', 'MolApp/Resources/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter analyze
      - run: flutter test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # flutter_inappwebview_linux renders through WPE WebKit offscreen. It prefers the modern
      # wpe-platform-2.0 API and falls back to wpe-webkit-1.1 + wpebackend-fdo-1.0, which is what
      # Ubuntu actually ships.
      - name: Install Flutter Linux and WPE WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libwpewebkit-1.1-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev libepoxy-dev
        working-directory: .
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-linux-x64
          path: flutter_app/build/linux/x64/release/bundle

  windows:
    runs-on: windows-latest
    # flutter_inappwebview_windows 0.7.0-beta.3 includes <experimental/coroutine>, which MSVC 14.51
    # (VS 18, what windows-latest ships) turns into a hard error C2338 / STL1011 rather than a
    # warning — so this job had never once passed. The macro is the escape hatch STL1011 itself
    # names, and cl.exe picks it up from the CL environment variable even when msbuild drives the
    # build, which means the plugin's own sources stay untouched and nothing is pinned to an image
    # that will age out. Drop this once the plugin moves to C++20 <coroutine>.
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # flutter_inappwebview_windows pulls the WebView2 SDK from NuGet at configure time.
      - uses: nuget/setup-nuget@v2
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-windows-x64
          path: flutter_app/build/windows/x64/runner/Release

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # The macOS/iOS plugin implementations still declare a 10.14 SPM platform, which fails to
      # compile against a current SDK. CocoaPods honours the app's own 10.15 target instead.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build apk --release
