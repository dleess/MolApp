# Builds the Flutter app on every target. Linux and Windows have no local hardware on the
# maintainer's machine, so CI is where those two are actually proven.
#
# No step consumes attacker-controllable event data (issue/PR titles, branch names); the only
# interpolation is FLUTTER_VERSION, defined below.
name: flutter

on:
  push:
    branches: [master]
    paths: ['flutter_app/**', 'MolApp/Resources/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter_app/**', 'MolApp/Resources/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter analyze
      - run: flutter test

  linux:
    # NON-BLOCKING, and expected to fail: the Flutter Linux target cannot build at all, anywhere.
    # Linux itself is not unsupported — it ships as the GTK/WebKitGTK shell in `linux/`, which the
    # `linux` workflow builds and tests for real on stock ubuntu-latest packages. This job only
    # tracks whether the *Flutter* route ever becomes viable.
    #
    # flutter_inappwebview_linux 0.1.0-beta.1 — the only version ever published — compiles against
    # WPE WebKit 2.40+ (WebKitScriptMessageReply, WebKitNetworkSession,
    # webkit_network_session_get_default/_get_cookie_manager) and libsoup3. No Ubuntu release has
    # ever shipped WPE WebKit 2.40 or newer: jammy is the only one carrying WPE at all, at 2.36, and
    # every release after it dropped the packages entirely. So there is no runner image, present or
    # future, on which this compiles from stock repositories — waiting for ubuntu-latest to advance
    # makes it worse, not better. The app is a webview wrapper, so this is a platform-viability fact
    # rather than a CI defect, and the job has never once passed since it was added.
    #
    # Kept running rather than deleted so it stays a canary: the day the plugin gains a backend that
    # matches a shipping WPE, or Ubuntu carries WPE again, this goes green on its own and
    # continue-on-error comes back out. The jammy pin, CXXFLAGS and pkg-config listing below are all
    # still load-bearing for that — they are what moved the failure from "package not found" to the
    # real diagnosis, and re-deriving them later would cost the same round trips again.
    #
    # The tolerance sits on the build step, not on the job: job-level continue-on-error still reports
    # the check as failed, which leaves the PR UNSTABLE and still needs --admin to merge. Step-level
    # lets the job conclude green while the failing step stays visibly red inside it — the tick means
    # "known-broken, not blocking", not "it built".
    #
    # Pinned to 22.04, not ubuntu-latest, and that is forced rather than chosen: flutter_inappwebview_linux
    # renders through WPE WebKit and its CMakeLists FATAL_ERRORs without it, but Ubuntu dropped every
    # WPE package after jammy. 24.04 has no libwpe-1.0-dev, no libwpebackend-fdo-1.0-dev and no
    # libwpewebkit-*-dev at all, which is why this job had never once passed — the names it asked for
    # could not be renamed into existence. jammy is the newest release that still carries them.
    #
    # The plugin tries wpe-webkit-2.0, then 1.1, then 1.0; jammy's libwpewebkit-1.0-dev (WPE WebKit
    # 2.36) satisfies the last of those, and libwpebackend-fdo-1.0-dev satisfies the legacy backend
    # path. Revisit when Ubuntu ships WPE again or the plugin grows a non-WPE Linux backend — this
    # image will age out first.
    runs-on: ubuntu-22.04
    # The plugin also appends -Wno-deprecated-literal-operator to CMAKE_CXX_FLAGS globally
    # (its linux/CMakeLists.txt:167), a flag clang only learned in 18 — jammy ships 14. Our own
    # runner target compiles with -Wall -Werror (flutter_app/linux/CMakeLists.txt:44), so the
    # unknown flag becomes -Wunknown-warning-option and then a hard error. CMake seeds
    # CMAKE_CXX_FLAGS from CXXFLAGS at first configure, which puts this ahead of the plugin's
    # append, and it only tolerates unknown -W flags — real warnings still fail the build.
    env:
      CXXFLAGS: -Wno-unknown-warning-option
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter Linux and WPE WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libwpewebkit-1.0-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev libepoxy-dev
        working-directory: .
      # Cheap, and makes any future failure self-diagnosing: if the plugin stops finding a backend,
      # this says which modules the image actually had.
      - name: Show the WPE pkg-config modules that are present
        run: pkg-config --list-all | grep -iE 'wpe|epoxy' || echo 'no wpe/epoxy modules found'
        working-directory: .
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - name: Build (expected to fail — WPE 2.40+ is unavailable, see the note on this job)
        run: flutter build linux --release
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-linux-x64
          path: flutter_app/build/linux/x64/release/bundle
          # There is no bundle while the build above fails; without this the upload turns the job
          # red again and undoes the point.
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    # flutter_inappwebview_windows 0.7.0-beta.3 includes <experimental/coroutine>, which MSVC 14.51
    # (VS 18, what windows-latest ships) turns into a hard error C2338 / STL1011 rather than a
    # warning — so this job had never once passed. The macro is the escape hatch STL1011 itself
    # names, and cl.exe picks it up from the CL environment variable even when msbuild drives the
    # build, which means the plugin's own sources stay untouched and nothing is pinned to an image
    # that will age out. Drop this once the plugin moves to C++20 <coroutine>.
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # flutter_inappwebview_windows pulls the WebView2 SDK from NuGet at configure time.
      - uses: nuget/setup-nuget@v2
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build windows --release
      # The distribution archive, built and proven here because there is no Windows hardware
      # locally — same reason the Linux .deb is only ever built in CI.
      - name: Package the distribution archive
        run: windows\packaging\build-zip.ps1
        shell: pwsh
      # A zip that unpacks but cannot find its Mol* assets would look fine above and fail on the
      # first user's machine, so unpack it somewhere else entirely and launch that copy.
      - name: Unpack it and launch the unpacked copy
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\molapp-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:TEMP\molapp-dist -Force
          if (-not (Test-Path $env:TEMP\molapp-dist\data\flutter_assets\assets\web\viewer.html)) {
            throw 'viewer.html missing from the archive'
          }
          $p = Start-Process $env:TEMP\molapp-dist\molapp.exe -PassThru
          Start-Sleep -Seconds 20
          # Still running after 20s is the pass; a crash on the WebView2 path exits well before that.
          if ($p.HasExited) { throw "molapp.exe exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-windows-x64
          path: flutter_app/dist/molapp-*-windows-x64.zip

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # The macOS/iOS plugin implementations still declare a 10.14 SPM platform, which fails to
      # compile against a current SDK. CocoaPods honours the app's own 10.15 target instead.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      # The one seam unit tests cannot reach: Dart → WKWebView → viewer.html → Mol* → back.
      # One file per step, not the directory: a single `flutter test integration_test -d macos`
      # fails on the second file with "Unable to start the app on the device" — macOS desktop
      # cannot relaunch the app within one invocation.
      - run: flutter test integration_test/viewer_bridge_test.dart -d macos
      - run: flutter test integration_test/measure_pick_test.dart -d macos
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign
      - name: Package the distribution image
        run: macos/packaging/build-dmg.sh
      # An image that mounts but ships an app without its Mol* assets would look fine above and
      # fail on the first user's machine, so the mounted copy is the one launched.
      - name: Mount it and launch the mounted copy
        run: |
          hdiutil attach dist/molapp-*-macos.dmg -nobrowse -mountpoint /tmp/molapp-dmg
          test -f "/tmp/molapp-dmg/MolApp.app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/web/viewer.html"
          /tmp/molapp-dmg/MolApp.app/Contents/MacOS/MolApp &
          pid=$!
          sleep 20
          # Still running after 20s is the pass; a broken WKWebView path exits well before that.
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-macos
          path: flutter_app/dist/molapp-*-macos.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build apk --release
