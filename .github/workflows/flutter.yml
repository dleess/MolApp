# Builds the Flutter app on every target. Linux and Windows have no local hardware on the
# maintainer's machine, so CI is where those two are actually proven.
#
# No step consumes attacker-controllable event data (issue/PR titles, branch names); the only
# interpolation is FLUTTER_VERSION, defined below.
name: flutter

on:
  push:
    branches: [master]
    paths: ['flutter_app/**', 'MolApp/Resources/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['flutter_app/**', 'MolApp/Resources/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter analyze
      - run: flutter test


  windows:
    runs-on: windows-latest
    # flutter_inappwebview_windows 0.7.0-beta.3 includes <experimental/coroutine>, which MSVC 14.51
    # (VS 18, what windows-latest ships) turns into a hard error C2338 / STL1011 rather than a
    # warning — so this job had never once passed. The macro is the escape hatch STL1011 itself
    # names, and cl.exe picks it up from the CL environment variable even when msbuild drives the
    # build, which means the plugin's own sources stay untouched and nothing is pinned to an image
    # that will age out. Drop this once the plugin moves to C++20 <coroutine>.
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # flutter_inappwebview_windows pulls the WebView2 SDK from NuGet at configure time.
      - uses: nuget/setup-nuget@v2
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build windows --release
      # The distribution archive, built and proven here because there is no Windows hardware
      # locally — same reason the Linux .deb is only ever built in CI.
      - name: Package the distribution archive
        run: windows\packaging\build-zip.ps1
        shell: pwsh
      # A zip that unpacks but cannot find its Mol* assets would look fine above and fail on the
      # first user's machine, so unpack it somewhere else entirely and launch that copy.
      - name: Unpack it and launch the unpacked copy
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\molapp-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:TEMP\molapp-dist -Force
          if (-not (Test-Path $env:TEMP\molapp-dist\data\flutter_assets\assets\web\viewer.html)) {
            throw 'viewer.html missing from the archive'
          }
          $p = Start-Process $env:TEMP\molapp-dist\molapp.exe -PassThru
          Start-Sleep -Seconds 20
          # Still running after 20s is the pass; a crash on the WebView2 path exits well before that.
          if ($p.HasExited) { throw "molapp.exe exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-windows-x64
          path: flutter_app/dist/molapp-*-windows-x64.zip

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # The macOS/iOS plugin implementations still declare a 10.14 SPM platform, which fails to
      # compile against a current SDK. CocoaPods enforces the app's macOS 12.0 minimum instead.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      # The one seam unit tests cannot reach: Dart → WKWebView → viewer.html → Mol* → back.
      # One file per step, not the directory: a single `flutter test integration_test -d macos`
      # fails on the second file with "Unable to start the app on the device" — macOS desktop
      # cannot relaunch the app within one invocation.
      - run: flutter test integration_test/viewer_bridge_test.dart -d macos
      - run: flutter test integration_test/measure_pick_test.dart -d macos
      - run: flutter build macos --release
      - name: Test native macOS file saving
        run: xcodebuild -quiet -workspace macos/Runner.xcworkspace -scheme Runner -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - run: flutter build ios --release --no-codesign
      - name: Package the distribution image
        run: macos/packaging/build-dmg.sh
      # An image that mounts but ships an app without its Mol* assets would look fine above and
      # fail on the first user's machine, so the mounted copy is the one launched.
      - name: Mount it and launch the mounted copy
        run: |
          hdiutil attach dist/molapp-*-macos.dmg -nobrowse -mountpoint /tmp/molapp-dmg
          test -f "/tmp/molapp-dmg/MolApp.app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets/web/viewer.html"
          /tmp/molapp-dmg/MolApp.app/Contents/MacOS/MolApp &
          pid=$!
          sleep 20
          # Still running after 20s is the pass; a broken WKWebView path exits well before that.
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: molapp-macos
          path: flutter_app/dist/molapp-*-macos.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_web_assets.dart
      - run: flutter build apk --release
