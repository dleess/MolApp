name: molapp
description: "MolApp — Mol*-powered molecule viewer for iOS, Android, macOS, Windows and Linux."
publish_to: 'none'

# Shared store version; +N sets Android versionCode and iOS CFBundleVersion.
version: 1.1.7+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The Mol* viewport. This is the one plugin that covers all four targets:
  # Android/iOS (WebKit+Chromium), macOS (WKWebView), Windows (WebView2).
  flutter_inappwebview: ^6.2.0-beta.3

  # File open (structure + .molapp state) and desktop save dialogs.
  file_selector: ^1.0.3
  # Mobile has no save dialog; exports go out through the system share sheet instead.
  share_plus: ^12.0.0
  path_provider: ^2.1.5

  # Export encoders. The viewport hands us a PNG data URL; these re-encode it.
  image: ^4.5.4
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lets a test stand in for the native Save-as dialog, including the cancel case.
  file_selector_platform_interface: ^2.6.2
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Synced from ../MolApp/Resources by `dart run tool/sync_web_assets.dart`. Gitignored.
  assets:
    - assets/web/
    - assets/web/molstar/
