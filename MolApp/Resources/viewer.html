<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MolApp Viewer</title>
  <style>
    html,
    body,
    #molstar-host {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0f14;
    }

    body {
      color: rgba(255, 255, 255, 0.86);
      font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #molstar-host {
      position: relative;
      display: grid;
      place-items: center;
      touch-action: none;
    }

    .empty-state {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .orbital {
      width: 230px;
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      box-shadow: inset 0 0 42px rgba(90, 160, 255, 0.15);
    }

    .label {
      color: rgba(255, 255, 255, 0.66);
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main id="molstar-host" aria-label="Molstar molecule viewport">
    <div class="empty-state">
      <div class="orbital" aria-hidden="true"></div>
      <div class="label">Mol* viewport ready</div>
    </div>
  </main>
</body>
</html>
