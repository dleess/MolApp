<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>MolApp Viewer</title>
  <link rel="stylesheet" href="molstar/molstar.css">
  <style>
    html,
    body,
    #molstar-host {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0f14;
    }

    body {
      color: rgba(255, 255, 255, 0.86);
      font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #molstar-host {
      position: relative;
      touch-action: none;
    }

    #molstar-host .msp-plugin {
      width: 100%;
      height: 100%;
    }

    .viewer-status {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #0b0f14;
    }

    .viewer-status[hidden] {
      display: none;
    }

    .viewer-status__message {
      max-width: 520px;
      color: rgba(255, 255, 255, 0.66);
      letter-spacing: 0;
    }

    .viewer-status--error .viewer-status__message {
      color: #ffb4a8;
    }
  </style>
</head>
<body>
  <main id="molstar-host" aria-label="Molstar molecule viewport"></main>
  <div id="viewer-status" class="viewer-status" role="status">
    <div id="viewer-status-message" class="viewer-status__message">Initializing Mol* viewer</div>
  </div>
  <script src="molstar/molstar.js"></script>
  <script>
    (function () {
      const host = document.getElementById('molstar-host');
      const status = document.getElementById('viewer-status');
      const statusMessage = document.getElementById('viewer-status-message');
      const doubleTapDelayMs = 320;
      let lastTapTime = 0;
      let nativeCommandQueue = Promise.resolve();

      function showError(error) {
        const message = error && error.message ? error.message : String(error);
        const fatal = !window.molapp || !window.molapp.viewer;
        window.molapp = Object.assign(window.molapp || {}, { error: message, handleNativeCommand });
        postViewerEvent({ event: 'viewerError', message, fatal });
        document.documentElement.dataset.viewerState = 'error';
        status.classList.add('viewer-status--error');
        status.hidden = false;
        statusMessage.textContent = 'Mol* viewer error: ' + message;
      }

      function postViewerEvent(event) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.molapp) {
          window.webkit.messageHandlers.molapp.postMessage(event);
        }
      }

      function postCommandResult(result) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.molapp) {
          window.webkit.messageHandlers.molapp.postMessage(result);
        }
      }

      function postSelectionChanged(selection) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.molapp) {
          window.webkit.messageHandlers.molapp.postMessage({
            event: 'selectionChanged',
            selection
          });
        }
      }

      let lastHoverLabel = null;
      function postPencilHover(label) {
        if (label === lastHoverLabel) return;
        lastHoverLabel = label;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.molapp) {
          window.webkit.messageHandlers.molapp.postMessage({ event: 'pencilHover', label });
        }
      }

      function structureCount() {
        if (!window.molapp || !window.molapp.viewer) {
          return 0;
        }

        return window.molapp.viewer.plugin.managers.structure.hierarchy.current.structures.length;
      }

      async function resetCamera() {
        const canvas = window.molapp.viewer.plugin.canvas3d;
        if (canvas) {
          canvas.requestCameraReset({ durationMs: 250 });
        }
      }

      async function loadStructureAndFocus(loadStructure) {
        const beforeCount = structureCount();
        setMolAppSelection(null);
        await loadStructure();
        await new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });

        if (structureCount() <= beforeCount) {
          throw new Error('Structure load completed, but no structure was added to the viewer.');
        }

        await resetCamera();
      }

      // Resolve which loaded structures an action applies to. `payload.targets` is the list
      // of structure names the user has left visible in the Objects panel. An absent list means
      // every loaded structure; an explicit empty list means the user has hidden every structure.
      function targetStructures(payload) {
        const all = window.molapp.viewer.plugin.managers.structure.hierarchy.current.structures;
        if (!payload || !Array.isArray(payload.targets)) {
          return all;
        }
        const targets = payload.targets;
        // Resolve each name via findStructureObject (matches by tracked structureRef or
        // label) — the structure's cell label does not always equal the loaded PDB name.
        const result = [];
        for (const name of targets) {
          const s = findStructureObject(name);
          if (s && result.indexOf(s) === -1) {
            result.push(s);
          }
        }
        return result;
      }

      // Mol* has no standalone "stick" representation. Sticks-only = ball-and-stick with the
      // element-sphere visual removed, so Stick differs from Ball+Stick (which keeps the spheres).
      const BALL_AND_STICK_VISUALS = ['element-sphere', 'intra-bond', 'inter-bond'];
      const STICK_ONLY_VISUALS = ['intra-bond', 'inter-bond'];

      // Force each component's atomic representation deterministically. The atomic-detail preset
      // auto-picks the repr type from structure heuristics — e.g. it renders spacefill (not
      // ball-and-stick) for NMR ensembles / low atoms-per-residue models like 1D3Z — so patching
      // "existing ball-and-stick visuals" silently no-ops and Stk/B+S come out as spheres. Rebuild
      // the repr explicitly (same clear+add path the selection code uses) so the type is exact:
      //   stick        → ball-and-stick, bonds only (no element spheres)
      //   ballAndStick → ball-and-stick, spheres + bonds
      //   sphere       → spacefill (van der Waals)
      async function applyAtomicRepresentation(target, representation) {
        if (!target || !target.components) return;
        const plugin = window.molapp.viewer.plugin;
        const reprType = representation === 'sphere' ? 'spacefill' : 'ball-and-stick';
        const typeParams = representation === 'stick'
          ? { visuals: STICK_ONLY_VISUALS.slice() }
          : representation === 'ballAndStick'
            ? { visuals: BALL_AND_STICK_VISUALS.slice() }
            : null;
        for (const comp of target.components) {
          await clearComponentRepresentations(comp);
          await plugin.builders.structure.representation.addRepresentation(
            comp.cell,
            { type: reprType, ...(typeParams ? { typeParams } : {}) }
          );
        }
      }

      // The stock molecular-surface preset builds one surface over the merged `all` component, so
      // every isolated crystallographic water becomes its own tiny sphere — a red-dot cloud on the
      // surface. Instead build the surface on the polymer component only (via the cartoon preset's
      // clean component split, then swap the polymer repr). Water/ligand stay separate & controllable.
      async function applySurfaceRepresentation(structures) {
        const plugin = window.molapp.viewer.plugin;
        await plugin.managers.structure.component.applyPreset(structures, 'preset-structure-representation-polymer-cartoon');
        const refIds = new Set(structures.map(s => s.cell.transform.ref));
        const current = plugin.managers.structure.hierarchy.current.structures;
        const refreshedTargets = current.filter(function (s) { return refIds.has(s.cell.transform.ref); });
        for (const s of refreshedTargets) {
          const polymer = (s.components || []).filter(function (c) {
            const tags = c.cell.transform.tags;
            return Array.isArray(tags) && tags.indexOf('structure-component-static-polymer') !== -1;
          });
          for (const comp of polymer) {
            await clearComponentRepresentations(comp);
            await plugin.builders.structure.representation.addRepresentation(
              comp.cell, { type: 'molecular-surface', color: 'chain-id' });
          }
        }
        await hideWaterForSurface(refreshedTargets);
      }

      async function applyRepresentationPreset(representation, structures) {
        const presetByRepresentation = {
          ribbon: 'preset-structure-representation-polymer-cartoon',
          surface: 'preset-structure-representation-molecular-surface',
          stick: 'preset-structure-representation-atomic-detail'
        };
        const preset = presetByRepresentation[representation];
        if (!preset) {
          throw new Error('Unknown representation: ' + representation);
        }

        const targets = structures || window.molapp.viewer.plugin.managers.structure.hierarchy.current.structures;
        if (!targets.length) {
          throw new Error('Load a structure before changing representation.');
        }

        if (representation === 'surface') {
          await applySurfaceRepresentation(targets);
        } else {
          await window.molapp.viewer.plugin.managers.structure.component.applyPreset(targets, preset);
        }
        if (representation === 'stick') {
          const refIds = new Set(targets.map(t => t.cell.transform.ref));
          const current = window.molapp.viewer.plugin.managers.structure.hierarchy.current.structures;
          for (const s of current) {
            if (refIds.has(s.cell.transform.ref)) await applyAtomicRepresentation(s, 'stick');
          }
        }
        window.molapp.representation = representation;
        // applyPreset rebuilt the lumped het components visible — re-split so per-ligand
        // visibility survives a representation change (no re-post; rows already exist).
        await refreshLigandSplit(false);
        await applyStoredFeatureVisibility();
        await resetCamera();
      }

      function clearSelectionVisuals() {
        if (!window.molapp || !window.molapp.viewer) {
          return;
        }

        const interactivity = window.molapp.viewer.plugin.managers.interactivity;
        interactivity.lociHighlights.clearHighlights();
        interactivity.lociSelects.deselectAll();
        window.molapp.selectionVisualState = {
          selected: false,
          contextDimmed: false
        };
      }

      function applySelectionVisuals(loci) {
        clearSelectionVisuals();
        if (!loci || !window.molapp || !window.molapp.viewer) {
          return;
        }

        const interactivity = window.molapp.viewer.plugin.managers.interactivity;
        const lociBundle = { loci };
        interactivity.lociSelects.selectOnly(lociBundle, true);
        interactivity.lociHighlights.highlightOnly(lociBundle, true);
        window.molapp.selectionVisualState = {
          selected: true,
          contextDimmed: true
        };
      }

      function setMolAppSelection(selection, loci) {
        window.molapp.selection = selection;
        window.molapp.selectionLoci = loci || null;
        if (selection && loci) {
          applySelectionVisuals(loci);
        } else {
          clearSelectionVisuals();
        }
        postSelectionChanged(selection);
      }

      function queryFromAST(ast) {
        if (!ast) return null;

        const structure = window.molstar.lib.structure;
        const queries = structure.Queries;
        const props = structure.StructureProperties;
        const atoms = queries.generators.atoms;

        switch (ast.kind) {
          case 'and':
            return queries.combinators.intersect([queryFromAST(ast.left[0]), queryFromAST(ast.right[0])]);
          case 'or':
            return queries.combinators.merge([queryFromAST(ast.left[0]), queryFromAST(ast.right[0])]);
          case 'not':
            return queries.modifiers.exceptBy(queries.generators.all, queryFromAST(ast.operand[0]));
          case 'chain':
            return atoms({
              chainTest: function (ctx) {
                const loc = ctx.element;
                return props.chain.label_asym_id(loc) === ast.value || props.chain.auth_asym_id(loc) === ast.value;
              }
            });
          case 'residue':
            return atoms({
              residueTest: function (ctx) {
                const loc = ctx.element;
                const value = parseInt(ast.value, 10);
                return props.residue.auth_seq_id(loc) === value || props.residue.label_seq_id(loc) === value;
              }
            });
          case 'atom':
            return atoms({
              atomTest: function (ctx) {
                const loc = ctx.element;
                return props.atom.label_atom_id(loc) === ast.value || props.atom.auth_atom_id(loc) === ast.value;
              }
            });
          case 'residueRange': {
            // Match the bounds explicitly: split('-') mangles negative numbering ("-5-10" splits to
            // ["","5","10"]), which the Swift side deliberately routes here.
            const rangeMatch = /^(-?\d+)-(-?\d+)$/.exec(ast.value);
            if (!rangeMatch) throw new Error('Malformed residue range: ' + ast.value);
            const rangeStart = parseInt(rangeMatch[1], 10);
            const rangeEnd = parseInt(rangeMatch[2], 10);
            return atoms({
              residueTest: function (ctx) {
                const loc = ctx.element;
                // Test both numberings (mirror the single-residue case) — `a || b` would drop a
                // valid residue numbered 0 by treating it as falsy.
                const auth = props.residue.auth_seq_id(loc);
                const label = props.residue.label_seq_id(loc);
                return (auth >= rangeStart && auth <= rangeEnd) || (label >= rangeStart && label <= rangeEnd);
              }
            });
          }
          case 'residueName':
            return atoms({
              residueTest: function (ctx) {
                const loc = ctx.element;
                const value = ast.value.toUpperCase();
                return props.residue.label_comp_id(loc) === value || props.residue.auth_comp_id(loc) === value;
              }
            });
          case 'model':
            return atoms({
              atomTest: function (ctx) {
                const loc = ctx.element;
                return props.unit.model_num(loc) === parseInt(ast.value, 10);
              }
            });
          default:
            return null;
        }
      }

      function selectionFromLoci(loci) {
        const structure = window.molstar && window.molstar.lib && window.molstar.lib.structure;
        const structureElement = structure && structure.StructureElement;
        const structureProperties = structure && structure.StructureProperties;
        if (!structureElement || !structureProperties || !structureElement.Loci.is(loci) || structureElement.Loci.isEmpty(loci)) {
          return null;
        }

        const location = structureElement.Loci.getFirstLocation(loci);
        const atomName = structureProperties.atom.label_atom_id(location) || structureProperties.atom.auth_atom_id(location) || null;
        const residueName = structureProperties.residue.label_comp_id(location) || structureProperties.residue.auth_comp_id(location) || null;
        const residueNumber = structureProperties.residue.auth_seq_id(location)
          ?? structureProperties.residue.label_seq_id(location)
          ?? null;
        const chain = structureProperties.chain.auth_asym_id(location) || structureProperties.chain.label_asym_id(location) || null;
        const model = structureProperties.unit.model_num(location) || null;
        const labelParts = [residueName, chain, residueNumber, atomName].filter(function (part) {
          return part !== null && part !== undefined && part !== '';
        });

        return {
          type: loci.kind === 'bond-loci' ? 'bond' : 'atom',
          label: labelParts.length ? labelParts.join(' ') : null,
          model,
          chain,
          residueNumber,
          atomName
        };
      }

      function handleNativeCommand(envelope) {
        nativeCommandQueue = nativeCommandQueue.then(
          function () { return performNativeCommand(envelope); },
          function () { return performNativeCommand(envelope); }
        );
        return nativeCommandQueue;
      }

      async function performNativeCommand(envelope) {
        const id = envelope && envelope.id ? envelope.id : '';
        const command = envelope && envelope.command ? envelope.command : '';
        let undoSnapshot = null;

        try {
          if (!window.molapp || !window.molapp.viewer) {
            throw new Error('Mol* viewer is not ready.');
          }

          const payload = envelope.payload || {};
          const handler = commandHandlers[command];
          if (!handler) {
            throw new Error('Unknown MolApp command: ' + command);
          }

          // Capture before mutation, but commit the history entry only after validation succeeds.
          // A rejected command must not destroy a valid redo branch.
          undoSnapshot = UNDOABLE_COMMANDS.has(command) ? captureUndoSnapshot() : null;

          const details = await handler(payload);
          if (undoSnapshot) pushUndoSnapshot(undoSnapshot);
          postCommandResult(Object.assign({ id, command, success: true }, details || {}));
        } catch (error) {
          if (error && error.molappMutated && undoSnapshot) pushUndoSnapshot(undoSnapshot);
          const message = error && error.message ? error.message : String(error);
          postCommandResult({ id, command, success: false, error: message });
        }
      }

      const commandHandlers = {
        loadLocalStructure: async function (payload) {
          if (!payload.data || !payload.format) {
            throw new Error('loadLocalStructure requires data and format.');
          }

          const label = payload.label || 'Local structure';
          if (Object.prototype.hasOwnProperty.call(window.molapp.objects, label)) {
            throw new Error('An object named "' + label + '" already exists.');
          }
          await loadStructureAndFocus(function () {
            return window.molapp.viewer.loadStructureFromData(payload.data, payload.format, {
              dataLabel: label
            });
          });
          const structures = window.molapp.viewer.plugin.managers.structure.hierarchy.current.structures;
          window.molapp.objects[label] = {
            type: 'structure',
            structureRef: structures[structures.length - 1]
          };
          await refreshLigandSplit(true);
          await applyStoredFeatureVisibility();
          postObjectsReplaced(objectsMeta(), window.molapp.visibility);
          return { label };
        },
        loadPdbId: async function (payload) {
          const pdbId = String(payload.pdbId || '').trim();
          if (!/^[A-Za-z0-9]{4}$/.test(pdbId)) {
            throw new Error('loadPdbId requires a 4-character PDB ID.');
          }

          const normalizedPdbId = pdbId.toUpperCase();
          if (Object.prototype.hasOwnProperty.call(window.molapp.objects, normalizedPdbId)) {
            throw new Error('An object named "' + normalizedPdbId + '" already exists.');
          }
          const url = 'https://files.rcsb.org/download/' + normalizedPdbId + '.cif';
          await loadStructureAndFocus(function () {
            return window.molapp.viewer.loadStructureFromUrl(url, 'mmcif', false, {
              label: normalizedPdbId
            });
          });
          const structures = window.molapp.viewer.plugin.managers.structure.hierarchy.current.structures;
          window.molapp.objects[normalizedPdbId] = {
            type: 'structure',
            structureRef: structures[structures.length - 1]
          };
          await refreshLigandSplit(true);
          await applyStoredFeatureVisibility();
          postObjectsReplaced(objectsMeta(), window.molapp.visibility);
          return { label: normalizedPdbId };
        },
        setRepresentation: async function (payload) {
          const structures = targetStructures(payload);
          const targetRefs = new Set(structures.map(function (s) { return s.cell.transform.ref; }));
          await applyRepresentationPreset(payload.representation || '', structures);
          for (const name in window.molapp.objects) {
            const object = window.molapp.objects[name];
            const target = object.type === 'structure' ? findStructureObject(name) : null;
            if (target && targetRefs.has(target.cell.transform.ref)) {
              object.structureRef = target;
              object.representation = payload.representation;
            }
          }
          postObjectsReplaced(objectsMeta(), window.molapp.visibility);
        },
        toggleVisibility: async function (payload) {
          const feature = payload.feature; // 'water' or 'ligand'
          const isVisible = Boolean(payload.isVisible);
          window.molapp.visibility[feature] = isVisible;

          if (!window.molapp || !window.molapp.viewer) return;

          const plugin = window.molapp.viewer.plugin;
          const structures = plugin.managers.structure.hierarchy.current.structures;

          // When ligands were split into per-ligand components, the master Ligand toggle drives
          // those (the lumped het components are hidden) rather than the lumped component, which
          // no longer renders anything. Keeps "Show/Hide Ligand" working after a split.
          if (feature === 'ligand' && Array.isArray(window.molapp.ligandResns) && window.molapp.ligandResns.length) {
            const synced = [];
            for (const name of window.molapp.ligandResns) {
              const comp = findSelectionComponent(name);
              if (comp && Boolean(comp.cell.state.isHidden) === isVisible) {
                plugin.managers.structure.component.toggleVisibility([comp]);
              }
              const o = window.molapp.objects[name];
              if (o) o.isHidden = !isVisible;
              synced.push({ name: name, isVisible: isVisible });
            }
            // Keep the lumped het components hidden so "Show Ligand" never resurrects a double-render.
            for (const s of structures) {
              const stillVisible = ligandLumpComponents(s).filter(c => !Boolean(c.cell.state.isHidden));
              if (stillVisible.length) plugin.managers.structure.component.toggleVisibility(stillVisible);
            }
            // Sync the per-ligand row eyes to the master toggle (they are separate native controls).
            postObjectVisibility(synced);
            postFeatureVisibility(feature, isVisible);
            return;
          }

          // 'protein' isn't a static key: it lives in the `polymer` component (cartoon/surface).
          // Deliberately NOT matching the atomic-detail `all` component — that merges polymer+water
          // +ligand into one, so hiding it would blank the whole scene and leave the Water/Ligand
          // toggles dead. In atomic (stick/B+S/sphere) modes there's no polymer component, so the
          // Protein toggle simply no-ops there (water/ligand can't be split out of `all` anyway).
          const wantTags = feature === 'protein'
            ? ['structure-component-static-polymer']
            : ['structure-component-static-' + feature];
          for (const s of structures) {
            const components = s.components.filter(c => {
              // Mol* tags the static water/ligand components on the transform as
              // `structure-component-static-<feature>` (cell.obj carries no tags).
              const tags = c.cell.transform.tags;
              return Array.isArray(tags) && wantTags.some(t => tags.indexOf(t) !== -1);
            });

            if (components.length > 0) {
              // isHidden is `undefined` (not `false`) while visible, so coerce both sides to Bool
              // before comparing — a strict `undefined === false` would skip the toggle and leave
              // water/ligand shown. Toggle only when current state differs from the request.
              const currentHidden = Boolean(components[0].cell.state.isHidden);
              if (currentHidden === isVisible) {
                plugin.managers.structure.component.toggleVisibility(components);
              }
            }
          }
          postFeatureVisibility(feature, isVisible);
        },
        focusSelection: async function () {
          const plugin = window.molapp.viewer.plugin;
          const loci = window.molapp.selectionLoci;
          if (loci) {
            plugin.managers.camera.focusLoci(loci);
          } else {
            await resetCamera();
          }
        },
        setSelection: async function (payload) {
          if (!payload || !payload.ast) {
            setMolAppSelection(payload);
            return;
          }

          const plugin = window.molapp.viewer.plugin;
          const structures = plugin.managers.structure.hierarchy.current.structures;

          if (structures.length === 0) {
            throw new Error('Load a structure before selecting.');
          }

          // Step 1: loci 계산 — 실패 시 조기 종료
          let loci, query, bundle;
          try {
            const structure = structures[0].cell.obj.data;
            query = queryFromAST(payload.ast);
            loci = window.molstar.lib.structure.StructureElement.Loci.fromQuery(structure, query);
            bundle = window.molstar.lib.structure.StructureElement.Bundle.fromLoci(loci);
          } catch (error) {
            console.error('Selection query failed:', error);
            throw error;
          }

          // Step 2: loci 비어있으면 dim 방지 — empty loci로 selectOnly 호출 시 뷰포트 흑화
          // StructureElement는 optional chaining으로 안전하게 접근
          const StructElem = window.molstar?.lib?.structure?.StructureElement;
          const isLociEmpty = !loci ||
            (StructElem && StructElem.Loci.is(loci) && StructElem.Loci.isEmpty(loci));
          if (isLociEmpty) {
            throw new Error('Selection matched no atoms.');
          }

          // Step 2b: named expression selection vs ad-hoc selection
          // Named selections render via dedicated components (no marker overlay → avoids
          // viewport-wide highlight wash-out / black screen on broad selections).
          const colonIdx = payload.label ? payload.label.indexOf(':') : -1;
          const selName = colonIdx > 0 ? payload.label.slice(0, colonIdx).trim() : null;

          if (!selName) {
            setMolAppSelection(payload, loci);
            return;
          }

          const existing = window.molapp.objects[selName];
          if (existing && (existing.type === 'structure' || existing.ligandSplit)) {
            throw new Error('An object named "' + selName + '" already exists.');
          }

          // Track metadata + selection state without applying highlight/select markers.
          window.molapp.selection = payload;
          window.molapp.selectionLoci = loci;
          clearSelectionVisuals();
          postSelectionChanged(payload);

          try {
            await removeSelectionComponent(selName);
            const compSelector = await plugin.builders.structure.tryCreateComponent(
              structures[0].cell,
              { type: { name: 'bundle', params: bundle }, nullIfEmpty: true, label: selName },
              selectionComponentKey(selName)
            );
            if (compSelector?.cell) {
              await plugin.builders.structure.representation.addRepresentation(
                compSelector.cell,
                {
                  type: 'cartoon',
                  color: 'uniform',
                  colorParams: { value: 0x0072B2 } // Okabe-Ito blue
                }
              );
              window.molapp.objects[selName] = {
                type: 'selection',
                loci,
                bundle,
                colorHex: null,
                representation: 'ribbon',
                componentRef: compSelector.ref
              };
              postObjectsReplaced(objectsMeta(), window.molapp.visibility);
            } else {
              throw new Error('Selection component could not be created.');
            }
          } catch (componentError) {
            console.error('[MolApp] Selection component creation failed:', componentError);
            const errMsg = componentError && componentError.message ? componentError.message : String(componentError);

        surfacePotential: async function (payload) {
          const plugin = window.molapp.viewer.plugin;

          if (!structures.length) {
            throw new Error('No visible structure to compute surface potential.');
          }

          // Build a molecular surface colored by a continuous electrostatic potential map
          // (screened-Coulomb / Debye-Hückel approximation of Poisson-Boltzmann — an
          // APBS-like map computed on-device without an external APBS volume). Creating the
          // representation with the color theme up front is more reliable than recoloring a
          // preset after the fact.
          registerEspColorTheme();

          // Remove any surface from a previous run so repeated calls don't stack.
          const priorRefs = window.molapp.surfacePotentialRefs || [];
          for (const ref of priorRefs) {
            try { await plugin.state.data.build().delete(ref).commit(); } catch (e) {}
          }
          window.molapp.surfacePotentialRefs = [];

          for (const s of structures) {
            const comp = await plugin.builders.structure.tryCreateComponentStatic(
              s.cell, 'polymer', 'surface-potential'

        startMorph: async function (payload) {

            throw new Error('No visible structure to morph.');
          }

            const count = t && t.cell && t.cell.obj && t.cell.obj.data ? t.cell.obj.data.frameCount : 0;
            return Math.max(max, count || 0);

          if (frameCount <= 1) {
            throw new Error('Morph needs a multi-model structure (e.g. an NMR ensemble or trajectory).');
          }

            return a.name === 'built-in.animate-model-index';

            ? { name: 'loop', params: { direction: 'forward' } }

          // building the representation with the theme directly) is what triggers Mol* to

        superpose: async function (payload) {
          const structs = targetStructures(payload);
          if (structs.length < 2) {
            throw new Error('Show at least two structures to superpose.');
          }

          // First visible structure is the fixed reference. Align the rest onto it by
          // sequence-aligning their Cα chains (Needleman-Wunsch), then iteratively fitting
          // to the common structural core — so structures with different sequences align too.
          const reference = structs[0];
          const refRes = buildResidueList(reference.cell.obj.data);
          if (!refRes.ca.length) {
            throw new Error('Reference structure has no Cα atoms to align.');
          }
          let alignedCount = 0;
          let bestRmsd = null;
          let smallestCore = null;

          for (let i = 1; i < structs.length; i++) {
            const mobile = structs[i];
            const mobileRes = buildResidueList(mobile.cell.obj.data);
            if (!mobileRes.ca.length) continue;

            const columns = needlemanWunsch(mobileRes.seq, refRes.seq);
            if (columns.length < 3) continue;
            const P = columns.map(function (c) { return mobileRes.ca[c[0]]; });
            const Q = columns.map(function (c) { return refRes.ca[c[1]]; });

            const fit = refineSuperposition(P, Q);
            if (!fit) continue;

            await applyConformationTransform(mobile.cell, fit.transform);
            alignedCount++;
            bestRmsd = bestRmsd === null ? fit.rmsd : Math.min(bestRmsd, fit.rmsd);
            smallestCore = smallestCore === null ? fit.coreSize : Math.min(smallestCore, fit.coreSize);
          }

          if (!alignedCount) {
            throw new Error('Could not align — no comparable Cα core found.');
          }
          window.molapp.superposeRmsd = bestRmsd;
          window.molapp.superposeCore = smallestCore;
          await resetCamera();
        },

        undo: async function () {
