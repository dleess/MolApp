plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.donghan.molapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.donghan.molapp"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.3"
    }

    // Upload-key signing. Credentials live in ~/.gradle/gradle.properties, never in git.
    signingConfigs {
        release {
            if (project.hasProperty('MOLAPP_STORE_FILE')) {
                storeFile file(MOLAPP_STORE_FILE)
                storePassword MOLAPP_STORE_PASSWORD
                keyAlias MOLAPP_KEY_ALIAS
                keyPassword MOLAPP_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('MOLAPP_STORE_FILE') ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.print:print:1.0.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
}

// Single source of truth for the web core: copy viewer.html + molstar from the shared iOS resources
// into the Android assets at build time, so the 4.8MB molstar bundle is never duplicated in git.
tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('../MolApp/Resources')) {
        include 'viewer.html'
        include 'molstar/**'
    }
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
